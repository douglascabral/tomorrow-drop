name: Release

# Builds the command-line program (Linux, Windows and macOS), the Linux package (.deb),
# the Windows application (.exe) and the macOS application (.dmg, Apple silicon and
# Intel). A version tag (v*) also publishes them as a GitHub release. A manual run
# only builds them, so the build can be checked. Every published file has the version
# in its name (tdrop-1.2.0-macos-arm64), taken from the VERSION file by
# scripts/collect-release.sh, which refuses a tag that is not v<VERSION>.
#
# macOS signing. The application and its disk image are signed with a Developer ID
# certificate, and notarized, when these repository secrets exist:
#   MACOS_CERTIFICATE            the "Developer ID Application" certificate and key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD   the password of the .p12 file
#   MACOS_NOTARY_KEY             the App Store Connect API key (AuthKey .p8), base64
#   MACOS_NOTARY_KEY_ID          the key id
#   MACOS_NOTARY_ISSUER          the issuer id
# Without them the application is signed ad hoc and the log says so (docs/PACKAGING.md).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Command-line program (Linux, Windows and macOS)
        run: make cross
      - name: Linux package (.deb)
        run: make package-linux
      - name: Windows application (.exe)
        run: make package-windows
      - name: Collect the files, with the version in their names
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          scripts/collect-release.sh release \
            bin/tdrop-linux-amd64 bin/tdrop-windows-amd64.exe bin/tdrop-macos-arm64 bin/tdrop-macos-amd64 \
            dist/TomorrowDrop-linux-amd64.deb dist/TomorrowDrop-windows-amd64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-windows
          path: release/
          if-no-files-found: error

  macos:
    name: Build the macOS application
    # An Apple silicon runner builds both architectures: only the compiler targets
    # Intel, so nothing has to run on an Intel Mac (docs/PACKAGING.md).
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::the certificate is not a Developer ID Application certificate"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Prepare the notarization key
        if: env.MACOS_NOTARY_KEY_B64 != '' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "MACOS_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Say how the application is signed
        run: |
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "Signing with: $MACOS_SIGN_IDENTITY"
          else
            echo "::warning::no signing certificate: the macOS application is signed ad hoc, and macOS warns on the first open"
          fi
          if [ -z "${MACOS_NOTARY_KEY:-}" ]; then
            echo "::warning::no notarization key: the macOS application is not notarized"
            # An id without its key must not turn notarization on.
            echo "MACOS_NOTARY_KEY_ID=" >> "$GITHUB_ENV"
          fi
      - name: macOS application (.app and .dmg, arm64 and amd64)
        run: make package-macos
      - name: Check the signature inside the disk images
        run: |
          for arch in arm64 amd64; do
            dmg="dist/TomorrowDrop-macos-$arch.dmg"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt-$arch" >/dev/null
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/mnt-$arch/Tomorrow Drop.app"
            hdiutil detach "$RUNNER_TEMP/mnt-$arch" >/dev/null
          done
      - name: Collect the files, with the version in their names
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          scripts/collect-release.sh release dist/TomorrowDrop-macos-arm64.dmg dist/TomorrowDrop-macos-amd64.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: release/
          if-no-files-found: error
      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

  publish:
    name: Checksums and release
    needs: [package, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          (cd release && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
          cat release/SHA256SUMS
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$GITHUB_REF_NAME" release
